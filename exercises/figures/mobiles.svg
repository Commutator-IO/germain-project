<svg xmlns="http://www.w3.org/2000/svg" width="420" height="210" viewBox="0 0 420 210" font-family="Latin Modern Roman, CMU Serif, Georgia, serif">
  <title>Deux cercles : à gauche, les trois points de rencontre de deux mobiles de vitesses 5 et 2 allant dans le même sens ; à droite, les sept points de rencontre quand ils vont en sens contraires.</title>
  <circle cx="105" cy="95" r="70" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <line x1="105" y1="95" x2="175" y2="95" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="105" y1="95" x2="70" y2="155.6" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="105" y1="95" x2="70" y2="34.4" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/>
  <circle cx="175" cy="95" r="3.4" fill="#38539d" stroke="none"/>
  <text x="188" y="100" font-size="12" text-anchor="middle" fill="#38539d">0</text>
  <circle cx="70" cy="155.6" r="3.4" fill="#38539d" stroke="none"/>
  <text x="63.5" y="171.9" font-size="12" text-anchor="middle" fill="#38539d">1</text>
  <circle cx="70" cy="34.4" r="3.4" fill="#38539d" stroke="none"/>
  <text x="63.5" y="28.1" font-size="12" text-anchor="middle" fill="#38539d">2</text>
  <text x="105" y="200" font-size="13" text-anchor="middle" fill="currentColor">même sens : 5 − 2 = 3</text>
  <circle cx="315" cy="95" r="70" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <line x1="315" y1="95" x2="385" y2="95" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="315" y1="95" x2="299.4" y2="163.2" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="315" y1="95" x2="251.9" y2="64.6" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="315" y1="95" x2="358.6" y2="40.3" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="315" y1="95" x2="358.6" y2="149.7" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="315" y1="95" x2="251.9" y2="125.4" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="315" y1="95" x2="299.4" y2="26.8" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35"/>
  <circle cx="385" cy="95" r="3.4" fill="#38539d" stroke="none"/>
  <text x="398" y="100" font-size="12" text-anchor="middle" fill="#38539d">0</text>
  <circle cx="299.4" cy="163.2" r="3.4" fill="#38539d" stroke="none"/>
  <text x="296.5" y="180.9" font-size="12" text-anchor="middle" fill="#38539d">1</text>
  <circle cx="251.9" cy="64.6" r="3.4" fill="#38539d" stroke="none"/>
  <text x="240.2" y="64" font-size="12" text-anchor="middle" fill="#38539d">2</text>
  <circle cx="358.6" cy="40.3" r="3.4" fill="#38539d" stroke="none"/>
  <text x="366.7" y="35.1" font-size="12" text-anchor="middle" fill="#38539d">3</text>
  <circle cx="358.6" cy="149.7" r="3.4" fill="#38539d" stroke="none"/>
  <text x="366.7" y="164.9" font-size="12" text-anchor="middle" fill="#38539d">4</text>
  <circle cx="251.9" cy="125.4" r="3.4" fill="#38539d" stroke="none"/>
  <text x="240.2" y="136" font-size="12" text-anchor="middle" fill="#38539d">5</text>
  <circle cx="299.4" cy="26.8" r="3.4" fill="#38539d" stroke="none"/>
  <text x="296.5" y="19.1" font-size="12" text-anchor="middle" fill="#38539d">6</text>
  <text x="315" y="200" font-size="13" text-anchor="middle" fill="currentColor">sens contraires : 5 + 2 = 7</text>
</svg>
