name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Checks also run on pull requests; only the deployment is reserved for
  # the main branch.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Token required to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, without cancelling the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `postinstall` vendors KaTeX into public/vendor/katex/, which the
      # transcript reading views load. It is not versioned, so this step is
      # what puts it in the artifact.
      - run: npm ci

      # `--deny-warnings` is essential: without it oxlint reports warnings but
      # exits with code 0, so this step could never fail.
      - name: Lint
        run: npm run lint

      # The reading views are derived from transcripts/*.tex and are not
      # versioned either. Rendering here rather than committing HTML keeps the
      # .tex the single source of record — a committed reading view would drift
      # from its source the first time someone corrected a word in a hurry.
      #
      - name: Render transcripts
        run: npm run render

      # The TEI export is derived from the same .tex, for the same reason: a
      # committed XML would drift from its source. It needs nothing beyond
      # Node; xmllint, when the runner has it, checks well-formedness.
      - name: Export TEI
        run: npm run tei

      # The TEI button opens a reading view rendered from that XML, not the
      # raw file. It fails the deploy rather than ship a button that 404s.
      - name: Render TEI reading views
        run: npm run tei-view

      # The acceptance criterion of #5: nothing a reader sees in the .tex view
      # may be lost on the way through the export. A difference fails here.
      - name: Check the TEI views against the .tex views
        run: npm run check-tei

      # The download PDFs are *built*, not stored.
      #
      # They are derived from transcripts/*.tex, so committing them would put
      # recompiled binaries into git history for no gain — the churn costs far
      # more over time than the files do. Measured: a compiled transcript is
      # ~35-100 kB, so all four notebooks come to roughly 80 MB and the whole
      # fonds to ~250 MB. The Pages artifact limit is 10 GB, so building here
      # and shipping them with the site stays comfortable for a long while.
      #
      # Tectonic rather than TeX Live: one binary that fetches only the packages
      # a document uses, so this step costs tens of megabytes instead of
      # gigabytes. Its package cache is keyed on the lockfile-free bundle URL,
      # hence the explicit cache key.
      - name: Install tectonic
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version

      # The exercise book's figures are SVG; rsvg-convert turns them into
      # the PDF the engine can include.
      - name: Install rsvg-convert
        run: sudo apt-get install -y --no-install-recommends librsvg2-bin

      - uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-v1

      # A transcript that fails to compile must not take the deploy with it:
      # the site is still worth publishing with one PDF missing, and the
      # manifest simply will not list that edition.
      - name: Compile transcript PDFs
        run: npm run pdf || true

      # `npm run build` chains `npm run manifest`, `tsc -b` and `vite build`,
      # so type errors fail this step.
      #
      # The manifest is generated on this checkout, so it lists exactly the
      # transcripts rendered and compiled above — and no facsimiles, which are
      # never stored anywhere. The pane reads them from Gallica's IIIF service
      # in the reader's browser; there is no relay to deploy or to point at.
      #
      # The site is served from the custom domain germain.commutator.io, i.e.
      # from the root, so assets must not be prefixed and BASE_PATH stays unset.
      - name: Build
        run: npm run build

      # GitHub Pages drops the custom domain on deploy unless a CNAME file
      # sits at the root of the artifact. `public/CNAME` is copied verbatim by
      # Vite, so this only guards against someone removing it.
      - name: Check the custom domain survived the build
        run: |
          test -f dist/CNAME || { echo "dist/CNAME missing — the custom domain would be lost"; exit 1; }
          cat dist/CNAME

      # `enablement: true` provisions GitHub Pages on the repository if it is
      # not set up yet. Without it the step fails with "Get Pages site failed"
      # until someone enables Pages by hand in the repository settings.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    # A pull request does not deploy; it only runs the checks.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
