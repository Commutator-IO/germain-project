name: lean

# The Lean proofs in lean/: statements of the modernised readings, proved
# against mathlib (docs/lean/article.pdf). Runs when lean/ changes, and by
# hand. It does not gate the deploy: a proof checks a reading, not the site.
on:
  push:
    branches: [main]
    paths: ['lean/**', '.github/workflows/lean.yml']
  pull_request:
    paths: ['lean/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain lean/lean-toolchain names, fetches mathlib's
      # prebuilt cache, and runs `lake build` (every warning an error, so a
      # `sorry` fails it). axiom-audit then fails if any declaration depends
      # on an axiom beyond propext, Classical.choice and Quot.sound.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          axiom-audit: true
